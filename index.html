<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kilocode DVD Screensaver - CHRISTMAS CHAOS EDITION 🎄</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #0a1628;
            width: 100vw;
            height: 100vh;
            font-family: 'Courier New', monospace;
        }

        #logo {
            position: absolute;
            width: 200px;
            height: auto;
            transition: filter 0.3s ease, transform 0.3s ease;
            user-select: none;
            pointer-events: none;
            z-index: 10;
        }

        .emoji-explosion {
            position: absolute;
            font-size: 40px;
            animation: explode 1s ease-out forwards;
            pointer-events: none;
            z-index: 5;
        }

        @keyframes explode {
            0% {
                transform: translate(0, 0) scale(0);
                opacity: 1;
            }
            100% {
                transform: translate(var(--x), var(--y)) scale(2);
                opacity: 0;
            }
        }

        .hit-corner {
            animation: flash 0.3s ease;
        }

        @keyframes flash {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .glitch {
            animation: glitch 0.3s linear;
        }

        @keyframes glitch {
            0%, 100% {
                transform: translate(0);
            }
            20% {
                transform: translate(-2px, 2px);
            }
            40% {
                transform: translate(-2px, -2px);
            }
            60% {
                transform: translate(2px, 2px);
            }
            80% {
                transform: translate(2px, -2px);
            }
        }

        .matrix-rain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .matrix-column {
            position: absolute;
            color: #0f0;
            font-size: 20px;
            animation: fall linear infinite;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh);
            }
        }

        .secret-message {
            position: absolute;
            color: #fff;
            font-size: 30px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            animation: fadeInOut 3s ease-out forwards;
            pointer-events: none;
            z-index: 20;
        }

        @keyframes fadeInOut {
            0% {
                opacity: 0;
                transform: scale(0.5) rotate(0deg);
            }
            50% {
                opacity: 1;
                transform: scale(1.5) rotate(360deg);
            }
            100% {
                opacity: 0;
                transform: scale(0.5) rotate(720deg);
            }
        }

        .disco-mode {
            animation: disco 0.5s linear infinite;
        }

        @keyframes disco {
            0% { background: #ff0000; }
            16% { background: #ff8800; }
            33% { background: #ffff00; }
            50% { background: #00ff00; }
            66% { background: #0088ff; }
            83% { background: #ff00ff; }
            100% { background: #ff0000; }
        }

        .portal {
            position: absolute;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: radial-gradient(circle, #ff00ff, #00ffff, #ffff00);
            animation: spin 2s linear infinite;
            opacity: 0.8;
            z-index: 8;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .trail {
            position: absolute;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: linear-gradient(45deg, #ff00ff, #00ffff);
            animation: fadeOut 1s ease-out forwards;
            z-index: 2;
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
                transform: scale(0);
            }
        }

        .snowflake {
            position: fixed;
            color: #fff;
            font-size: 20px;
            text-shadow: 0 0 5px #fff;
            animation: snowfall linear infinite;
            pointer-events: none;
            z-index: 3;
        }

        @keyframes snowfall {
            0% {
                transform: translateY(-10vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(110vh) rotate(720deg);
                opacity: 0.3;
            }
        }

        .santa-hat {
            position: absolute;
            font-size: 60px;
            transform: rotate(-15deg) translate(-10px, -45px);
            pointer-events: none;
            z-index: 11;
            filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.5));
        }

        .christmas-lights {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 30px;
            display: flex;
            justify-content: space-around;
            z-index: 100;
            pointer-events: none;
        }

        .light-bulb {
            font-size: 25px;
            animation: twinkle 1s ease-in-out infinite;
        }

        .light-bulb:nth-child(odd) {
            animation-delay: 0.5s;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 1; filter: brightness(1.5); }
            50% { opacity: 0.5; filter: brightness(0.8); }
        }

        .present {
            position: absolute;
            font-size: 50px;
            animation: bounce-present 1s ease-in-out infinite;
            pointer-events: none;
            z-index: 6;
        }

        @keyframes bounce-present {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .candy-cane-border {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 20px;
            background: repeating-linear-gradient(
                45deg,
                #ff0000,
                #ff0000 10px,
                #ffffff 10px,
                #ffffff 20px
            );
            z-index: 100;
            pointer-events: none;
        }

        .christmas-disco {
            animation: christmas-disco 0.5s linear infinite;
        }

        @keyframes christmas-disco {
            0% { background: #c41e3a; }
            25% { background: #165b33; }
            50% { background: #bb2528; }
            75% { background: #146b3a; }
            100% { background: #c41e3a; }
        }

        @media (prefers-reduced-motion: reduce) {
            .disco-mode,
            .christmas-disco,
            .glitch,
            .snowflake,
            .matrix-column,
            .emoji-explosion,
            .present,
            .trail,
            .light-bulb {
                animation: none !important;
            }
            .snowflake {
                opacity: 0.7;
            }
        }
    </style>
</head>
<body>

    <div id="logo-container" style="position: absolute;">
        <span class="santa-hat">🎅</span>
        <img id="logo" src="logo.png" alt="Kilocode Logo">

    <script>
        const logo = document.getElementById('logo');
        const logoContainer = document.getElementById('logo-container');
        const body = document.body;
        const matrixCanvas = document.getElementById('matrix');
        const matrixCtx = matrixCanvas.getContext('2d');

        // Configuration constants
        const LOGO_WIDTH = 200;

        const GRAVITY_REVERSE_DURATION_MS = 1500;
        const SIZE_CHANGE_DURATION_MS = 2000;
        const SIZE_CHANGE_MIN = 100;
        const SIZE_CHANGE_MAX = 300;
        const SNOW_BLIZZARD_COUNT = 30;

        // Check for reduced motion preference
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        // Create Christmas lights
        const lightsContainer = document.getElementById('lights');
        const lightColors = ['🔴', '🟢', '🔵', '🟡', '🟣', '⚪'];
        for (let i = 0; i < LIGHT_COUNT; i++) {
            const light = document.createElement('span');
            light.className = 'light-bulb';
            light.textContent = lightColors[i % lightColors.length];
            light.style.animationDelay = (Math.random() * LIGHT_ANIMATION_DELAY_MAX) + 's';
            lightsContainer.appendChild(light);
        }

        // Create snowflakes
        function createSnowflake() {
            const snowflake = document.createElement('div');
            snowflake.className = 'snowflake';
            snowflake.textContent = ['❄', '❅', '❆', '✻', '✼', '❋'][Math.floor(Math.random() * 6)];
            snowflake.style.left = Math.random() * 100 + 'vw';
            snowflake.style.fontSize = (10 + Math.random() * 20) + 'px';
            snowflake.style.animationDuration = (5 + Math.random() * 10) + 's';
            snowflake.style.opacity = 0.5 + Math.random() * 0.5;
            body.appendChild(snowflake);
            
            setTimeout(() => snowflake.remove(), SNOWFLAKE_LIFETIME_MS);
        }

        // Spawn snowflakes continuously (reduced if prefers-reduced-motion)
        const snowflakeSpawnInterval = prefersReducedMotion ? SNOWFLAKE_SPAWN_INTERVAL_MS * 5 : SNOWFLAKE_SPAWN_INTERVAL_MS;
        setInterval(createSnowflake, snowflakeSpawnInterval);
        // Initial burst of snowflakes (reduced if prefers-reduced-motion)
        const snowflakeInitialBurst = prefersReducedMotion ? Math.floor(SNOWFLAKE_INITIAL_BURST / 5) : SNOWFLAKE_INITIAL_BURST;
        for (let i = 0; i < snowflakeInitialBurst; i++) {
            setTimeout(createSnowflake, i * SNOWFLAKE_BURST_INTERVAL_MS);
        }
        
        const colors = [

        const emojis = ['💥', '🚀', '⭐', '🔥', '💫', '✨', '🌟', '💎', '🎉', '🎊', '🎄', '🎅', '🤶', '🦌', '⛄', '🎁', '🔔', '❄️', '🌟', '🍪', '🥛', '🧦', '🕯️', '🎿', '☃️'];
        const messages = [
            'KILO RULES!',
            'CORNER HIT!',
            'MAXIMUM VELOCITY',
            'CHAOS MODE ACTIVATED',
            '404: GRAVITY NOT FOUND',
            'BOUNCING SINCE 1999',
            'DVD WHO?',
            'SCREEN SAVER SUPREME',
            'EDGE LORD',
            'PHYSICS.EXE STOPPED',
            'CORNER INCOMING...',
            'BOING BOING BOING',
            'HO HO HO! 🎅',
            'MERRY CHAOS-MAS!',
            'JINGLE BELLS JINGLE BELLS',
            'SANTA SAW THAT CORNER HIT',
            'RUDOLPH WHO?!',
            'DECK THE HALLS WITH BOUNCING LOGOS',
            'FELIZ NAVI-BOUNCE',
            'SILENT NIGHT? NOT HERE!',
            'SANTA\'S FAVORITE SCREENSAVER',
            '🎄 TREE-MENDOUS! 🎄',
            'SLEIGH ALL DAY',
            'YULE BE AMAZED'
        ];

        const alternateImages = [
            'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAwIiBoZWlnaHQ9IjIwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48dGV4dCB4PSI1MCUiIHk9IjUwJSIgZm9udC1zaXplPSI4MCIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZG9taW5hbnQtYmFzZWxpbmU9Im1pZGRsZSI+8J+agDwvdGV4dD48L3N2Zz4=', // Rocket
            'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAwIiBoZWlnaHQ9IjIwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48dGV4dCB4PSI1MCUiIHk9IjUwJSIgZm9udC1zaXplPSI4MCIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZG9taW5hbnQtYmFzZWxpbmU9Im1pZGRsZSI+8J+NlTwvdGV4dD48L3N2Zz4=', // Pizza
            'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAwIiBoZWlnaHQ9IjIwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48dGV4dCB4PSI1MCUiIHk9IjUwJSIgZm9udC1zaXplPSI4MCIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZG9taW5hbnQtYmFzZWxpbmU9Im1pZGRsZSI+8J+mhDwvdGV4dD48L3N2Zz4=', // Unicorn
            'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAwIiBoZWlnaHQ9IjIwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48dGV4dCB4PSI1MCUiIHk9IjUwJSIgZm9udC1zaXplPSI4MCIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZG9taW5hbnQtYmFzZWxpbmU9Im1pZGRsZSI+8J+RvjwvdGV4dD48L3N2Zz4=', // Alien
            'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAwIiBoZWlnaHQ9IjIwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48dGV4dCB4PSI1MCUiIHk9IjUwJSIgZm9udC1zaXplPSI4MCIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZG9taW5hbnQtYmFzZWxpbmU9Im1pZGRsZSI+8J+kljwvdGV4dD48L3N2Zz4=', // Robot
            'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAwIiBoZWlnaHQ9IjIwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48dGV4dCB4PSI1MCUiIHk9IjUwJSIgZm9udC1zaXplPSI4MCIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZG9taW5hbnQtYmFzZWxpbmU9Im1pZGRsZSI+8J+OhDwvdGV4dD48L3N2Zz4=', // Christmas Tree
            'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAwIiBoZWlnaHQ9IjIwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48dGV4dCB4PSI1MCUiIHk9IjUwJSIgZm9udC1zaXplPSI4MCIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZG9taW5hbnQtYmFzZWxpbmU9Im1pZGRsZSI+8J+OgTwvdGV4dD48L3N2Zz4=', // Present
            'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAwIiBoZWlnaHQ9IjIwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48dGV4dCB4PSI1MCUiIHk9IjUwJSIgZm9udC1zaXplPSI4MCIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZG9taW5hbnQtYmFzZWxpbmU9Im1pZGRsZSI+8J+FhTwvdGV4dD48L3N2Zz4=', // Santa
            'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAwIiBoZWlnaHQ9IjIwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48dGV4dCB4PSI1MCUiIHk9IjUwJSIgZm9udC1zaXplPSI4MCIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZG9taW5hbnQtYmFzZWxpbmU9Im1pZGRsZSI+4puEPC90ZXh0Pjwvc3ZnPg==', // Snowman

        ];

        let x = Math.random() * (window.innerWidth - LOGO_WIDTH);
        let y = Math.random() * (window.innerHeight - LOGO_HEIGHT);
        let dx = INITIAL_SPEED;
        let dy = INITIAL_SPEED;
        let currentColorIndex = 0;
        let bounceCount = 0;
        let isMatrixActive = false;
        let originalSrc = logo.src;
        let speedMultiplier = 1;
        let rotationAngle = 0;
        let isSpinning = false;

        function getRandomColor() {
            currentColorIndex = Math.floor(Math.random() * colors.length);
            return colors[currentColorIndex];
        }

        function changeColor() {
            logo.style.filter = getRandomColor();
        }

        function createEmojiExplosion(centerX, centerY) {
            for (let i = 0; i < EMOJI_EXPLOSION_COUNT; i++) {
                const emoji = document.createElement('div');
                emoji.className = 'emoji-explosion';
                emoji.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                emoji.style.left = centerX + 'px';
                emoji.style.top = centerY + 'px';
                
                const angle = (Math.PI * 2 * i) / EMOJI_EXPLOSION_COUNT;
                const distance = EMOJI_EXPLOSION_DISTANCE_MIN + Math.random() * (EMOJI_EXPLOSION_DISTANCE_MAX - EMOJI_EXPLOSION_DISTANCE_MIN);
                emoji.style.setProperty('--x', Math.cos(angle) * distance + 'px');
                emoji.style.setProperty('--y', Math.sin(angle) * distance + 'px');
                
                body.appendChild(emoji);
                setTimeout(() => emoji.remove(), EMOJI_EXPLOSION_DURATION_MS);
            }
        }

        function showSecretMessage() {
            const message = document.createElement('div');
            message.className = 'secret-message';
            message.textContent = messages[Math.floor(Math.random() * messages.length)];
            message.style.left = Math.random() * (window.innerWidth - 300) + 'px';
            message.style.top = Math.random() * (window.innerHeight - 100) + 'px';
            body.appendChild(message);
            setTimeout(() => message.remove(), SECRET_MESSAGE_DURATION_MS);
        }

        function activateMatrixRain() {
            if (isMatrixActive) return;
            isMatrixActive = true;
            
            matrixCanvas.width = window.innerWidth;
            matrixCanvas.height = window.innerHeight;
            
            const columns = Math.floor(window.innerWidth / MATRIX_COLUMN_WIDTH);
            const drops = Array(columns).fill(0);
            
            const matrixInterval = setInterval(() => {
                matrixCtx.fillStyle = `rgba(0, 0, 0, ${MATRIX_FADE_ALPHA})`;
                matrixCtx.fillRect(0, 0, matrixCanvas.width, matrixCanvas.height);
                
                matrixCtx.fillStyle = '#0f0';
                matrixCtx.font = `${MATRIX_COLUMN_WIDTH}px monospace`;
                
                for (let i = 0; i < drops.length; i++) {
                    const text = String.fromCharCode(Math.random() * 128);
                    matrixCtx.fillText(text, i * MATRIX_COLUMN_WIDTH, drops[i] * MATRIX_COLUMN_WIDTH);
                    
                    if (drops[i] * MATRIX_COLUMN_WIDTH > matrixCanvas.height && Math.random() > MATRIX_DROP_RESET_CHANCE) {
                        drops[i] = 0;
                    }
                    drops[i]++;
                }
            }, 50);
            
            setTimeout(() => {
                clearInterval(matrixInterval);
                matrixCtx.clearRect(0, 0, matrixCanvas.width, matrixCanvas.height);
                isMatrixActive = false;
            }, MATRIX_DURATION_MS);
        }

        function createPortal(options = {}) {
            const { background = null } = options;
            
            const portal = document.createElement('div');
            portal.className = 'portal';
            if (background) {
                portal.style.background = background;
            }
            portal.style.left = Math.random() * (window.innerWidth - PORTAL_SIZE) + 'px';
            portal.style.top = Math.random() * (window.innerHeight - PORTAL_SIZE) + 'px';
            body.appendChild(portal);
            
            setTimeout(() => {
                // Teleport logo
                x = parseFloat(portal.style.left) + PORTAL_OFFSET - LOGO_WIDTH / 2;
                y = parseFloat(portal.style.top) + PORTAL_OFFSET - LOGO_HEIGHT / 2;
                createEmojiExplosion(x + LOGO_WIDTH / 2, y + LOGO_HEIGHT / 2);
                portal.remove();
            }, PORTAL_DURATION_MS);
        }

        function createChristmasPortal() {
            createPortal({ background: 'radial-gradient(circle, #c41e3a, #165b33, #f8b229)' });
        }

        function glitchEffect() {
            logo.classList.add('glitch');
            setTimeout(() => logo.classList.remove('glitch'), GLITCH_DURATION_MS);
        }

        function temporarilyChangeImage() {
            const randomImage = alternateImages[Math.floor(Math.random() * alternateImages.length)];
            logo.src = randomImage;
            setTimeout(() => {
                logo.src = originalSrc;
            }, IMAGE_CHANGE_DURATION_MS);
        }

        function activateDiscoMode() {
            // 50% chance for Christmas disco vs regular disco
            if (Math.random() < DISCO_CHRISTMAS_CHANCE) {
                body.classList.add('christmas-disco');
                setTimeout(() => body.classList.remove('christmas-disco'), DISCO_DURATION_MS);
            } else {
                body.classList.add('disco-mode');
                setTimeout(() => body.classList.remove('disco-mode'), DISCO_DURATION_MS);
            }
        }

        function createPresent() {
            const present = document.createElement('div');
            present.className = 'present';
            present.textContent = ['🎁', '🎀', '📦'][Math.floor(Math.random() * 3)];
            present.style.left = Math.random() * (window.innerWidth - PRESENT_SIZE) + 'px';
            present.style.top = Math.random() * (window.innerHeight - PRESENT_SIZE) + 'px';
            body.appendChild(present);
            
            setTimeout(() => present.remove(), PRESENT_DURATION_MS);
        }

        function jingleBells() {
            // Create a cascade of bells
            for (let i = 0; i < JINGLE_BELL_COUNT; i++) {
                setTimeout(() => {
                    const bell = document.createElement('div');
                    bell.className = 'emoji-explosion';
                    bell.textContent = '🔔';
                    bell.style.left = Math.random() * window.innerWidth + 'px';
                    bell.style.top = Math.random() * window.innerHeight + 'px';
                    bell.style.setProperty('--x', (Math.random() - 0.5) * 200 + 'px');
                    bell.style.setProperty('--y', (Math.random() - 0.5) * 200 + 'px');
                    body.appendChild(bell);
                    setTimeout(() => bell.remove(), EMOJI_EXPLOSION_DURATION_MS);
                }, i * JINGLE_BELL_INTERVAL_MS);
            }
        }

        function createTrail() {
            const trail = document.createElement('div');
            trail.className = 'trail';
            trail.style.left = (x + LOGO_WIDTH / 2 - 10) + 'px';
            trail.style.top = (y + LOGO_HEIGHT / 2 - 10) + 'px';
            body.appendChild(trail);
            setTimeout(() => trail.remove(), EMOJI_EXPLOSION_DURATION_MS);
        }

        function triggerRandomEvent() {
            const events = [
                () => { if (!prefersReducedMotion) createEmojiExplosion(x + LOGO_WIDTH / 2, y + LOGO_HEIGHT / 2); },
                () => showSecretMessage(),
                () => { if (!prefersReducedMotion) activateMatrixRain(); },
                () => createPortal(),
                () => { if (!prefersReducedMotion) glitchEffect(); },
                () => temporarilyChangeImage(),
                () => { if (!prefersReducedMotion) activateDiscoMode(); },
                () => { speedMultiplier = SPEED_MULTIPLIER_MAX; setTimeout(() => speedMultiplier = 1, DISCO_DURATION_MS); },
                () => { isSpinning = true; setTimeout(() => isSpinning = false, SPIN_DURATION_MS); },
                () => {
                    // Reverse gravity temporarily
                    dy = -Math.abs(dy);
                    setTimeout(() => dy = Math.abs(dy), GRAVITY_REVERSE_DURATION_MS);
                },
                () => {
                    // Size change
                    logo.style.width = (SIZE_CHANGE_MIN + Math.random() * (SIZE_CHANGE_MAX - SIZE_CHANGE_MIN)) + 'px';
                    setTimeout(() => logo.style.width = `${LOGO_WIDTH}px`, SIZE_CHANGE_DURATION_MS);
                },
                // Christmas-specific events
                () => createPresent(),
                () => createChristmasPortal(),
                () => jingleBells(),
                () => {
                    // Snow blizzard - spawn extra snowflakes (reduced if prefers-reduced-motion)
                    const count = prefersReducedMotion ? Math.floor(SNOW_BLIZZARD_COUNT / 3) : SNOW_BLIZZARD_COUNT;
                    for (let i = 0; i < count; i++) {
                        setTimeout(createSnowflake, i * SNOW_BLIZZARD_INTERVAL_MS);
                    }
                },
                () => {
                    // Christmas tree trail
                    const count = prefersReducedMotion ? 1 : CHRISTMAS_TREE_COUNT;
                    for (let i = 0; i < count; i++) {
                        setTimeout(() => {
                            const tree = document.createElement('div');
                            tree.className = 'emoji-explosion';
                            tree.textContent = '🎄';
                            tree.style.left = (x + LOGO_WIDTH / 2) + 'px';
                            tree.style.top = (y + LOGO_HEIGHT / 2) + 'px';
                            tree.style.setProperty('--x', '0px');
                            tree.style.setProperty('--y', '0px');
                            body.appendChild(tree);
                            setTimeout(() => tree.remove(), EMOJI_EXPLOSION_DURATION_MS);
                        }, i * CHRISTMAS_TREE_INTERVAL_MS);
                    }
                }
            ];
            
            const randomEvent = events[Math.floor(Math.random() * events.length)];
            randomEvent();
        }

        function animate() {
            const logoWidth = logo.offsetWidth;
            const logoHeight = logo.offsetHeight;
            
            x += dx * speedMultiplier;
            y += dy * speedMultiplier;

            // Create trail occasionally
            if (Math.random() < TRAIL_PROBABILITY) {
                createTrail();
            }

            // Spin if activated
            if (isSpinning) {
                rotationAngle += SPIN_ANGLE_INCREMENT;
                logo.style.transform = `rotate(${rotationAngle}deg)`;
            } else {
                logo.style.transform = 'rotate(0deg)';
            }

            let hitEdge = false;
            let hitCorner = false;

            // Check horizontal boundaries
            if (x + logoWidth >= window.innerWidth) {
                x = window.innerWidth - logoWidth;
                dx = -dx;
                hitEdge = true;
            } else if (x <= 0) {
                x = 0;
                dx = -dx;
                hitEdge = true;
            }

            // Check vertical boundaries
            if (y + logoHeight >= window.innerHeight) {
                y = window.innerHeight - logoHeight;
                dy = -dy;
                hitEdge = true;
            } else if (y <= 0) {
                y = 0;
                dy = -dy;
                hitEdge = true;
            }

            // Check if hit corner
            if ((x <= 0 || x + logoWidth >= window.innerWidth) && 
                (y <= 0 || y + logoHeight >= window.innerHeight)) {
                hitCorner = true;
                logo.classList.add('hit-corner');
                setTimeout(() => logo.classList.remove('hit-corner'), CORNER_HIT_FLASH_DURATION_MS);
                
                // Corner hits trigger special events (reduced if prefers-reduced-motion)
                if (!prefersReducedMotion) {
                    createEmojiExplosion(x + logoWidth/2, y + logoHeight/2);
                    activateDiscoMode();
                }
                showSecretMessage();
            }

            if (hitEdge) {
                changeColor();
                bounceCount++;
                
                // Every 5 bounces, trigger a random event
                if (bounceCount % BOUNCE_EVENT_INTERVAL === 0) {
                    triggerRandomEvent();
                }
                
                // Every 10 bounces, go extra crazy (reduced if prefers-reduced-motion)
                if (bounceCount % MATRIX_EVENT_INTERVAL === 0) {
                    if (!prefersReducedMotion) {
                        activateMatrixRain();
                    }
                    createPortal();
                }
            }

            logoContainer.style.left = x + 'px';
            logoContainer.style.top = y + 'px';

            requestAnimationFrame(animate);
        }

        // Wait for image to load before starting animation
        logo.onload = () => {
            changeColor();
            animate();
            
            // Start with a Christmas bang (reduced if prefers-reduced-motion)
            setTimeout(() => {
                showSecretMessage();
                if (!prefersReducedMotion) {
                    createEmojiExplosion(window.innerWidth/2, window.innerHeight/2);
                    jingleBells();
                }
            }, STARTUP_DELAY_MS);
        };

        // Handle window resize
        window.addEventListener('resize', () => {
            const logoWidth = logo.offsetWidth;
            const logoHeight = logo.offsetHeight;
            
            if (x + logoWidth > window.innerWidth) {
                x = window.innerWidth - logoWidth;
            }
            if (y + logoHeight > window.innerHeight) {
                y = window.innerHeight - logoHeight;
            }
            
            matrixCanvas.width = window.innerWidth;
            matrixCanvas.height = window.innerHeight;
        });

        // Random events every 10-20 seconds
        setInterval(() => {
            if (Math.random() < RANDOM_EVENT_CHANCE) {
                triggerRandomEvent();
            }
        }, RANDOM_EVENT_INTERVAL_MS);
    </script>
</body>
</html>
